name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python helpers
        run: python -m py_compile scripts/vendor_skills.py scripts/check_registry.py
      - name: Validate vendor registry JSON
        run: python -m json.tool skills/vendor/registry.json > /dev/null
      - name: Validate vendor registry contract
        run: python scripts/check_registry.py
      - name: Exercise registry listing
        run: |
          python scripts/vendor_skills.py list
          python scripts/vendor_skills.py list --tier core
          python scripts/vendor_skills.py list --category sprites

  vendor-path-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill:
          - openai-sprite-pipeline
          - inference-character-design-sheet
          - comfyui-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install one reviewed upstream skill
        run: python scripts/vendor_skills.py install "${{ matrix.skill }}"
      - name: Verify installed skill contract
        run: |
          test -f ".agents/vendor/${{ matrix.skill }}/SKILL.md"
          test -f ".agents/vendor/${{ matrix.skill }}/.awful-vendor.json"
